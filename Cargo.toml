[package]
name = "lambris"
version = "0.9.3"
edition = "2024"
# The oldest toolchain this is known to build on. Declared so an older one
# says so, rather than failing with a page of syntax errors.
rust-version = "1.89"
license = "MIT"
description = "A terminal viewer for parquet, CSV/TSV and Excel files, with joins, computed columns, crops and a script language"
repository = "https://github.com/gmtsciencedev/lambris"
homepage = "https://github.com/gmtsciencedev/lambris"
readme = "README.md"
keywords = ["csv", "parquet", "tsv", "excel", "tui"]
categories = ["command-line-utilities", "science", "visualization"]
# Sample and benchmark data are not part of what is published. They are already
# untracked, and cargo packages what git tracks, but saying so costs nothing.
exclude = ["/big.*", "/sample*"]

[profile.release]
# What is shipped is downloaded far more often than it is debugged, and a
# backtrace from a release build is not much use anyway.
strip = true

[dependencies]
anyhow = "1.0.103"
arrow = "59.1.0"
calamine = { version = "0.36.1", features = ["dates"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.9"
parquet = "59.1.0"
ratatui = "0.30.2"
regex = "1.12.4"
rust_xlsxwriter = { version = "0.98.2", features = ["constant_memory", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

