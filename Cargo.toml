[package]
name = "lambris"
version = "0.8.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.103"
arrow = "59.1.0"
calamine = { version = "0.36.1", features = ["dates"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.9"
parquet = "59.1.0"
ratatui = "0.30.2"
regex = "1.12.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
rust_xlsxwriter = "0.98.2"
